services:
  # PostgreSQL Database Service - Persistent storage
  - type: pspg
    name: jeff-database
    plan: free
    region: oregon
    databaseName: jeffdb
    user: jeffuser

  # Web Service
  - type: web
    name: jeff-backend
    env: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate && gunicorn backend.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      # Link to the database service - Render automatically provides DATABASE_URL
      - key: DATABASE_URL
        fromDatabase:
          name: jeff-database
          property: connectionString
