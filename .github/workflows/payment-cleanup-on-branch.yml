name: Payment cleanup (branch)

on:
  push:
    branches: [cleanup/remove-payment-code]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove obsolete payment runtime code
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          import shutil

          root = Path('.')

          def remove_method(text: str, name: str) -> str:
              return re.sub(rf"\n    def {re.escape(name)}\(.*?(?=\n    def |\n# Global instance|\Z)", "\n", text, flags=re.S)

          # Remove payment-only application/source trees. Historical transaction data is not touched here.
          for rel in [
              'backend/payment',
              'backend/core/services/conversation/payment_integration.py',
              'supabase/functions/payment-webhook',
              'supabase/functions/payment-initiate',
              'frontend/app/controller/initiate',
              'frontend/app/pages/cart',
          ]:
              p = root / rel
              if p.exists():
                  shutil.rmtree(p) if p.is_dir() else p.unlink()

          # Remove payment app/configuration from Django settings while retaining the Django app itself for now.
          p = root / 'backend/backend/settings.py'
          if p.exists():
              s = p.read_text()
              s = s.replace("    'payment',\n", "")
              s = re.sub(r"\n\s*# Payment settings.*?(?=\n\s*# File upload settings)", "\n", s, flags=re.S)
              s = re.sub(r"\n\s*'PAYNOW_[A-Z0-9_]+':.*?\n", "\n", s)
              s = re.sub(r"\n\s*'TOKEN_PRICE(?:_USD|_ZWG)?':.*?\n", "\n", s)
              s = re.sub(r"\n\s*'TOKEN_USES':.*?\n", "\n", s)
              s = re.sub(r"\n\s*'PAYMENT_TIMEOUT_SECONDS':.*?\n", "\n", s)
              p.write_text(s)

          # Remove payment routing from the legacy Django conversation workflow.
          p = root / 'backend/core/services/conversation_workflow.py'
          if p.exists():
              s = p.read_text()
              s = re.sub(r"^from \.conversation\.payment_integration.*\n", "", s, flags=re.M)
              s = re.sub(r"^\s*self\.payment_integration = .*\n", "", s, flags=re.M)
              s = s.replace("        'token_check',       # Step 2: Token Check\n", "")
              s = re.sub(r"\n            elif message_classification == 'P':.*?(?=\n            elif message_classification == 'G':)", "\n            elif message_classification == 'P':\n                # Payment is no longer a supported product flow; treat legacy payment text as a normal inquiry.\n                message_classification = 'A'\n", s, flags=re.S)
              s = re.sub(r"\n            elif current_step == 'token_check':\n                return self\.step_handlers\._handle_token_check_step\(conversation, message\)", "", s)
              s = re.sub(r"\n            elif current_step == 'payment_confirmation':\n                return self\.payment_integration\.handle_payment_confirmation_step\(conversation, message\)", "", s)
              for name in [
                  '_handle_token_check_step',
                  '_handle_payment_request',
                  '_handle_payment_confirmation_step',
                  '_show_properties_and_payment_instructions',
                  '_show_payment_instructions',
              ]:
                  s = remove_method(s, name)
              p.write_text(s)

          # Remove token/payment gates from the legacy step handler. Django remains a fallback during the broader migration.
          p = root / 'backend/core/services/conversation/step_handlers.py'
          if p.exists():
              s = p.read_text()
              s = re.sub(r"^from \.payment_integration.*\n", "", s, flags=re.M)
              s = re.sub(r"^\s*self\.payment_integration = .*\n", "", s, flags=re.M)

              # Inquiry: remove the initial token gate and the duplicate token-check branch.
              s = re.sub(r"\n                # Check token validity before proceeding\n                from payment\.handlers\.token import token_handler\n                valid_token = token_handler\.get_valid_token\(conversation\.cell_number\)\n                if not valid_token or not token_handler\.validate_token_usage\(valid_token\):\n                    return self\._show_payment_instructions\(conversation\)\n", "\n", s)
              s = re.sub(r"\n                # Determine next step based on token validity\n                if not valid_token or not token_handler\.validate_token_usage\(valid_token\):\n                    conversation\.current_step = 'token_check'\n                    conversation\.save\(\)\n                    return self\._show_payment_instructions\(conversation\)\n", "\n", s)

              # Property listings: remove token validation block.
              s = re.sub(r"\n            # First check if user has a valid token\n            from payment\.handlers\.token import token_handler\n            valid_token = token_handler\.get_valid_token\(conversation\.cell_number\)\n            if not valid_token or not token_handler\.validate_token_usage\(valid_token\):\n                return self\._show_payment_instructions\(conversation\)\n", "\n", s)

              # Name collection: remove token validation/deduction block.
              s = re.sub(r"\n                # First check and deduct token.*?\n                # Create booking after successful token deduction\n", "\n                # Create booking without payment/token gating.\n", s, flags=re.S)

              # Remove obsolete payment/token-only methods.
              for name in [
                  '_handle_token_check_step',
                  '_show_properties_and_payment_instructions',
                  '_show_payment_instructions',
              ]:
                  s = remove_method(s, name)
              p.write_text(s)

          # Remove stale token-step references from NLP state handling.
          p = root / 'backend/core/services/conversation/nlp_processor.py'
          if p.exists():
              s = p.read_text().replace("conversation.current_step = 'token_check'", "conversation.current_step = 'property_listings'")
              p.write_text(s)

          # Remove stale payment wording from matching prompts/source.
          p = root / 'backend/matching/nlp_processor.py'
          if p.exists():
              s = re.sub(r"^.*(?:PayNow|payment required|purchase a token|token price).*$\n?", "", s, flags=re.I|re.M)
              p.write_text(s)

          # Remove the now-unused payment export from the conversation package.
          p = root / 'backend/core/services/conversation/__init__.py'
          if p.exists():
              s = p.read_text()
              s = re.sub(r"^.*payment_integration.*\n", "", s, flags=re.M)
              p.write_text(s)

          # Remove payment-specific Twilio content settings references from legacy source only when they are explicitly payment-related.
          for p in root.rglob('*.py'):
              if '.git' in p.parts or '__pycache__' in p.parts or p.name in {'models.py'}:
                  continue
              s = p.read_text(errors='ignore')
              s = re.sub(r"^\s*(?:from|import) payment(?:\.[\w_]+)*.*\n", "", s, flags=re.M)
              p.write_text(s)
          PY

      - name: Verify cleanup did not leave broken Python imports
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q backend
          if git grep -nE 'from payment|import payment|payment_integration|payment-webhook|payment-initiate|token_handler|TOKEN_PRICE|TOKEN_USES|PAYNOW_' -- ':!.github/workflows/*' ':!*.md' ':!backend/core/migrations/*' ':!backend/payment/*'; then
            echo 'Active payment/token runtime references remain.'
            exit 1
          fi

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: remove obsolete payment and token runtime code' || exit 0
          git push
