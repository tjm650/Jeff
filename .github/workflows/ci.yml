name: CI

on:
  push:
    branches: [main, master, free-mode-ci-fix-2]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  django-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Detect Django project
        id: detect
        run: |
          if [ -f backend/manage.py ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - name: Install backend dependencies
        if: steps.detect.outputs.present == 'true'
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; elif [ -f requirements/base.txt ]; then pip install -r requirements/base.txt; fi
      - name: Django checks
        if: steps.detect.outputs.present == 'true'
        working-directory: backend
        run: python manage.py check
      - name: No Django backend present
        if: steps.detect.outputs.present != 'true'
        run: echo "No backend/manage.py found; Django checks skipped."

  django-legacy-regression:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Detect Django project
        id: detect
        run: |
          if [ -f backend/manage.py ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - name: Install backend dependencies
        if: steps.detect.outputs.present == 'true'
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; elif [ -f requirements/base.txt ]; then pip install -r requirements/base.txt; fi
      - name: Legacy Django tests
        if: steps.detect.outputs.present == 'true'
        working-directory: backend
        run: python manage.py test
      - name: No Django backend present
        if: steps.detect.outputs.present != 'true'
        run: echo "No backend/manage.py found; legacy tests skipped."
