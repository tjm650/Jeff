name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend — lint, typecheck, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build

  backend:
    name: Legacy Django — checks and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jeff_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d jeff_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Django system checks
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/jeff_test
        run: python manage.py check

      - name: Django migrations check
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/jeff_test
        run: python manage.py makemigrations --check --dry-run

      - name: Apply Django migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/jeff_test
        run: python manage.py migrate --noinput

      - name: Django test suite
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/jeff_test
        run: python manage.py test

  supabase:
    name: Supabase migration foundation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify Supabase CLI
        run: supabase --version

      - name: Verify migration directory
        run: |
          test -d supabase/migrations
          echo "Supabase migration directory is present."
          find supabase/migrations -maxdepth 1 -type f -print | sort

      - name: Validate migration SQL files when present
        if: ${{ hashFiles('supabase/migrations/*.sql') != '' }}
        run: |
          echo "Supabase SQL migrations detected. Full local database validation will be enabled with the first target schema migration."
