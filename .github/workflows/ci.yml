name: CI

on:
  push:
    branches: [main, master, 'agent/**']
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run typecheck --if-present
      - run: npm test --if-present -- --runInBand
      - run: npm run build

  django:
    runs-on: ubuntu-latest
    if: ${{ hashFiles('backend/requirements*.txt', 'backend/pyproject.toml', 'backend/manage.py') != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; elif [ -f requirements/base.txt ]; then pip install -r requirements/base.txt; fi
      - name: Django checks
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: config.settings
        run: python manage.py check
      - name: Django tests
        working-directory: backend
        run: python manage.py test
