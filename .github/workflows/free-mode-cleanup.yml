name: Free Mode Cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove payment architecture and enable free access
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re
          import shutil
          root = Path('.')

          def remove_method(text, name):
              return re.sub(rf"\n    def {name}\(.*?(?=\n    def |\Z)", '\n', text, flags=re.S)

          for p in [root/'backend/payment', root/'backend/core/services/conversation/payment_integration.py', root/'supabase/functions/payment-webhook', root/'frontend/app/controller/initiate', root/'frontend/app/pages/cart']:
              if p.exists(): shutil.rmtree(p) if p.is_dir() else p.unlink()

          # Conversation workflow.
          p = root/'backend/core/services/conversation_workflow.py'
          if p.exists():
              s = p.read_text()
              s = re.sub(r"^from \.conversation\.payment_integration.*\n", '', s, flags=re.M)
              s = re.sub(r"^\s*self\.payment_integration.*\n", '', s, flags=re.M)
              s = re.sub(r"^\s*'token_check'.*\n", '', s, flags=re.M)
              s = re.sub(r"            elif message_classification == 'P':.*?(?=            elif message_classification == 'G':)", "            elif message_classification == 'P':\n                message_classification = 'A'\n\n", s, flags=re.S)
              for name in ['_handle_payment_request','_handle_payment_confirmation_step','_show_payment_instructions','_handle_token_check_step','handle_payment_webhook','_show_properties_and_payment_instructions']:
                  s = remove_method(s, name)
              s = re.sub(r"\n            elif current_step == 'token_check':\n                return self\.step_handlers\._handle_token_check_step\(conversation, message\)", '', s)
              s = re.sub(r"\n            elif current_step == 'payment_confirmation':\n                return self\.payment_integration\.handle_payment_confirmation_step\(conversation, message\)", '', s)
              p.write_text(s)

          # Step handlers: delete all token gates by semantic blocks.
          p = root/'backend/core/services/conversation/step_handlers.py'
          if p.exists():
              s = p.read_text()
              s = re.sub(r"^from \.payment_integration.*\n", '', s, flags=re.M)
              s = re.sub(r"^\s*self\.payment_integration.*\n", '', s, flags=re.M)
              s = re.sub(r"\n            # Check token validity\n.*?(?=\n        except Exception as e:)", '\n', s, count=1, flags=re.S)
              s = re.sub(r"\n            # First check if user has a valid token\n.*?(?=\n            # Check if user wants to see more properties)", '\n', s, count=1, flags=re.S)
              s = re.sub(r"\n                # Check token validity before proceeding\n.*?(?=\n                # Add invert_sort flag)", '\n', s, count=1, flags=re.S)
              s = re.sub(r"\n                # Determine next step based on token validity\n.*?(?=\n                # Proceed to property search)", '\n', s, count=1, flags=re.S)
              for name in ['_handle_token_check_step','_show_payment_instructions','_show_properties_and_payment_instructions']:
                  s = remove_method(s, name)
              p.write_text(s)

          # NLP processor: free searches go to listings.
          p = root/'backend/core/services/conversation/nlp_processor.py'
          if p.exists():
              s = p.read_text()
              s = s.replace("conversation.current_step = 'token_check'", "conversation.current_step = 'property_listings'")
              s = s.replace("step_handlers._handle_token_check_step(conversation, message)", "step_handlers._handle_property_listings_step(conversation, message)")
              p.write_text(s)

          # Property search: remove token lookup.
          p = root/'backend/core/services/conversation/property_search.py'
          if p.exists():
              s = p.read_text()
              s = re.sub(r"\n            # Check if user has a valid token\n.*?(?=\n            # Import recommendation service)", "\n            # Free mode: all users receive the same recommendation flow.\n            has_valid_token = True\n\n", s, count=1, flags=re.S)
              s = re.sub(r"from payment\.handlers\.token import token_handler.*?\n", '', s)
              p.write_text(s)

          # Help and package exports.
          p = root/'backend/core/services/conversation/help_utils.py'
          if p.exists():
              s = p.read_text()
              s = re.sub(r"\s*elif current_step == 'token_check':\n\s*return self\._get_token_help\(context_data\)\n", '\n', s)
              s = remove_method(s, '_get_token_help')
              s = re.sub(r"    def handle_media_message\(.*?(?=\n\n# Global instance|\Z)", "    def handle_media_message(self, cell_number: str, media_url: str, caption: str) -> str:\n        return \"Thanks. Please continue with your accommodation requirements or property selection.\"\n\n", s, flags=re.S)
              p.write_text(s)
          p = root/'backend/core/services/conversation/__init__.py'
          if p.exists(): p.write_text(re.sub(r".*payment_integration.*\n", '', p.read_text()))

          # Views.
          p = root/'backend/core/views.py'
          if p.exists():
              s = p.read_text()
              s = re.sub(r"^from payment\.payment_handler.*\n", '', s, flags=re.M)
              s = remove_method(s, 'verify_payment')
              s = s.replace('from .models import Property, Token, Transaction, Conversation', 'from .models import Property, Conversation')
              s = re.sub(r"\s*'active_tokens': Token\.objects\.filter\(is_active=True\)\.count\(\),", '', s)
              s = re.sub(r"\s*'total_transactions': Transaction\.objects\.count\(\),", '', s)
              s = remove_method(s, 'revenue_analytics')
              p.write_text(s)

          # Models: remove exactly Token and Transaction; preserve Booking and Review.
          p = root/'backend/core/models.py'
          if p.exists():
              s = p.read_text()
              s = re.sub(r"\nclass Token\(models\.Model\):.*?(?=\nclass Transaction\(models\.Model\):)", '\n', s, flags=re.S)
              s = re.sub(r"\nclass Transaction\(models\.Model\):.*?(?=\nclass Booking\(models\.Model\):)", '\n', s, flags=re.S)
              def update_conversation_steps(m):
                  block = m.group(0)
                  steps = "    STEPS = [\n        ('inquiry', 'Inquiry'),\n        ('property_listings', 'Property Listings'),\n        ('name_collection', 'Name Collection'),\n        ('booking_request', 'Booking Request'),\n        ('provider_response', 'Provider Response'),\n        ('info_request', 'Additional Info'),\n        ('booking_confirmation', 'Booking Confirmation'),\n        ('cleanup', 'Completed'),\n    ]"
                  return re.sub(r"    STEPS = \[.*?\n    \]", steps, block, count=1, flags=re.S)
              s = re.sub(r"class ConversationState\(models\.Model\):.*?(?=\nclass Review\(models\.Model\):)", update_conversation_steps, s, flags=re.S)
              p.write_text(s)

          # Analytics: accommodation-only metrics.
          p = root/'backend/core/analytics.py'
          if p.exists():
              p.write_text('''from django.db.models import Avg\nfrom django.utils import timezone\nfrom datetime import timedelta\nfrom .models import Property, Conversation, Booking\n\nclass JeffAnalytics:\n    def get_dashboard_metrics(self):\n        now = timezone.now()\n        return {'total_properties': Property.objects.filter(is_active=True).count(), 'total_conversations': Conversation.objects.count(), 'total_bookings': Booking.objects.count(), 'recent_conversations': Conversation.objects.filter(last_message_at__gte=now-timedelta(hours=24)).count(), 'recent_bookings': Booking.objects.filter(created_at__gte=now-timedelta(days=30)).count(), 'average_property_rating': Property.objects.filter(is_active=True).aggregate(avg=Avg('rating'))['avg'] or 0}\n    def get_conversation_analytics(self, days=7):\n        return {'conversations': Conversation.objects.filter(last_message_at__gte=timezone.now()-timedelta(days=days)).count()}\n    def get_property_analytics(self):\n        return {'active_properties': Property.objects.filter(is_active=True).count()}\n    def get_booking_analytics(self, days=30):\n        return {'bookings': Booking.objects.filter(created_at__gte=timezone.now()-timedelta(days=days)).count()}\n\nanalytics = JeffAnalytics()\n''')

          # Other payment remnants.
          p = root/'backend/core/middleware.py'
          if p.exists(): p.write_text(p.read_text().replace('https://js.paynow.co.zw','').replace('https://api.paynow.co.zw',''))
          p = root/'backend/whatsapp/utils/whatsapp_service.py'
          if p.exists(): p.write_text(remove_method(p.read_text(), 'send_payment_confirmation'))
          p = root/'backend/matching/nlp_processor.py'
          if p.exists(): p.write_text(re.sub(r'^.*(?:Payment|PayNow|token).*$','',p.read_text(),flags=re.I|re.M))

          # Tests: remove payment-only imports/tests.
          p = root/'backend/core/tests/test_workflow.py'
          if p.exists():
              s=p.read_text(); s=re.sub(r"from core\.models import \(.*?\n\)","from core.models import Property, AccommodationProvider, ConversationState, Booking",s,flags=re.S); s=re.sub(r"from payment\..*\n",'',s); s=re.sub(r"\ndef test_token_and_payment_flow\(.*?(?=\ndef |\Z)",'\n',s,flags=re.S); p.write_text(s)
          p = root/'backend/whatsapp/tests.py'
          if p.exists(): p.write_text(re.sub(r"\ndef test_.*?payment.*?(?=\ndef |\Z)",'\n',re.sub(r".*patch\('payment\..*\n",'',p.read_text()),flags=re.S|re.I))

          # Remove generated caches/logs and payment-only files.
          for p in root.rglob('__pycache__'):
              if p.is_dir(): shutil.rmtree(p, ignore_errors=True)
          if (root/'backend/logs/django.log').exists(): (root/'backend/logs/django.log').unlink()
          for p in list(root.rglob('*')):
              if p.is_file() and '.git' not in p.parts and p.name.lower() in {'paynow_service.py','payment_processor.py','payment_handler.py','payment_integration.py'}:
                  try: p.unlink()
                  except OSError: pass

          # Existing Django DBs lose payment models via migration.
          (root/'backend/core/migrations/0002_remove_payment_models.py').write_text('''from django.db import migrations\n\nclass Migration(migrations.Migration):\n    dependencies = [('core', '0001_initial')]\n    operations = [migrations.DeleteModel(name='Token'), migrations.DeleteModel(name='Transaction')]\n''')

          # Settings/URLs.
          for path in [root/'backend/backend/settings.py', root/'backend/backend/urls.py']:
              if path.exists():
                  s=path.read_text(); s=re.sub(r".*['\"]payment['\"].*\n",'',s); s=re.sub(r".*payment\.urls.*\n",'',s); s=re.sub(r'(?im)^.*(?:PAYNOW|PAYMENT|TOKEN_PRICE|TOKEN_USES).*$\n?','',s); path.write_text(s)
          PY

      - name: Verify free mode and syntax
        shell: bash
        run: |
          set -e
          if git grep -nEi 'paynow|payment_integration|payment-webhook|payment_handler|token_handler|TOKEN_PRICE|TOKEN_USES|/payment/|payment_confirmation|token_check' -- ':!.github/workflows/free-mode-cleanup.yml' ':!*.md' ':!privacy/*' ':!*.lock' ':!supabase/migrations/*' ':!backend/core/migrations/*' ':!*.pyc' ':!backend/db.sqlite3'; then
            echo 'Payment-related active source references remain.'
            exit 1
          fi
          python -m compileall -q backend

      - name: Commit free-mode cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: remove payment functionality and enable free use' || exit 0
          git push
