name: Free Mode Cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove payment architecture and convert workflow to free access
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re
          import shutil

          root = Path('.')

          # Delete the dedicated payment backend and Supabase payment function.
          for p in [root/'backend/payment', root/'supabase/functions/payment-webhook']:
              if p.exists():
                  shutil.rmtree(p)

          # Remove payment/cart frontend files wherever their paths are unambiguously payment-only.
          frontend_paths = [
              root/'frontend/app/controller/initiate',
              root/'frontend/app/pages/cart',
          ]
          for p in frontend_paths:
              if p.exists():
                  shutil.rmtree(p)

          # Remove payment-related dependency/config lines from common text files.
          for path in [root/'README.md', root/'backend/README.md', root/'frontend/README.md']:
              if path.exists():
                  s = path.read_text()
                  s = re.sub(r'(?im)^.*(?:payment|paynow|token-based access|token purchase|mobile money).*$\n?', '', s)
                  path.write_text(s)

          # Conversation workflow: remove payment routing and make every accommodation enquiry free.
          p = root/'backend/core/services/conversation_workflow.py'
          if p.exists():
              s = p.read_text()
              s = s.replace('from .conversation.payment_integration import payment_integration_handler\n', '')
              s = s.replace("        self.payment_integration = payment_integration_handler\n", '')
              s = s.replace("        'token_check',       # Step 2: Token Check\n", '')
              s = s.replace("            elif message_classification == 'P':\n                # Payment message - handle payment request directly\n                logger.info(f\"Payment message detected for {cell_number}\")\n                return self.payment_integration.handle_payment_request(conversation, message)\n\n", "            elif message_classification == 'P':\n                # Legacy payment-like messages are treated as normal free accommodation enquiries.\n                logger.info(f\"Legacy payment-like message treated as free accommodation enquiry for {cell_number}\")\n                message_classification = 'A'\n\n")
              s = re.sub(r"            elif current_step == 'token_check':\n                return self\.step_handlers\._handle_token_check_step\(conversation, message\)\n", '', s)
              s = re.sub(r"            elif current_step == 'payment_confirmation':\n                return self\.payment_integration\.handle_payment_confirmation_step\(conversation, message\)\n", '', s)
              # Remove payment-only wrapper methods.
              for name in ['_handle_payment_request','_handle_payment_confirmation_step','_show_payment_instructions']:
                  s = re.sub(rf"\n    def {name}\(.*?(?=\n    def |\Z)", '\n', s, flags=re.S)
              s = s.replace('    def _show_properties_and_payment_instructions(self, conversation: ConversationState, requirements: Dict) -> str:\n        """Show properties found count and payment instructions together"""\n        # This method is now handled in step_handlers\n        return self.step_handlers._show_properties_and_payment_instructions(conversation, requirements)\n\n\n', '')
              p.write_text(s)

          # Step handlers: remove token/payment gating so searches proceed immediately.
          p = root/'backend/core/services/conversation/step_handlers.py'
          if p.exists():
              s = p.read_text()
              s = s.replace('from .payment_integration import payment_integration_handler\n', '')
              s = s.replace('        self.payment_integration = payment_integration_handler\n', '')

              # Remove token checks in inquiry step.
              s = re.sub(r"                # Check token validity before proceeding\n                from payment\.handlers\.token import token_handler\n                valid_token = token_handler\.get_valid_token\(conversation\.cell_number\)\n                if not valid_token or not token_handler\.validate_token_usage\(valid_token\):\n                    return self\._show_payment_instructions\(conversation\)\n                    \n", '', s)
              s = re.sub(r"                # Determine next step based on token validity\n                if not valid_token or not token_handler\.validate_token_usage\(valid_token\):\n                    conversation\.current_step = 'token_check'\n                    conversation\.save\(\)\n                    return self\._show_payment_instructions\(conversation\)\n                \n", '', s)

              # Remove token gate from property listings step.
              s = re.sub(r"\n            # First check if user has a valid token\n            from payment\.handlers\.token import token_handler\n            valid_token = token_handler\.get_valid_token\(conversation\.cell_number\)\n            if not valid_token or not token_handler\.validate_token_usage\(valid_token\):\n                return self\._show_payment_instructions\(conversation\)\n", '', s)

              # Remove dedicated token-check method and payment-only methods.
              for name in ['_handle_token_check_step','_show_payment_instructions','_show_properties_and_payment_instructions']:
                  s = re.sub(rf"\n    def {name}\(.*?(?=\n    def |\Z)", '\n', s, flags=re.S)
              p.write_text(s)

          # Remove payment-only models from core models.
          p = root/'backend/core/models.py'
          if p.exists():
              s = p.read_text()
              s = re.sub(r'\nclass Token\(models\.Model\):.*?(?=\nclass Booking\(models\.Model\):)', '\n', s, flags=re.S)
              s = re.sub(r'\nclass Transaction\(models\.Model\):.*?(?=\nclass Booking\(models\.Model\):)', '\n', s, flags=re.S)
              # Conversation states are now search/booking states only.
              s = re.sub(r"    STEPS = \[.*?\n    \]", "    STEPS = [\n        ('inquiry', 'Inquiry'),\n        ('property_listings', 'Property Listings'),\n        ('name_collection', 'Name Collection'),\n        ('booking_request', 'Booking Request'),\n        ('provider_response', 'Provider Response'),\n        ('info_request', 'Additional Info'),\n        ('booking_confirmation', 'Booking Confirmation'),\n        ('cleanup', 'Completed'),\n    ]", s, count=1, flags=re.S)
              p.write_text(s)

          # Remove payment references from Django settings and root deployment config.
          for path in [root/'backend/backend/settings.py', root/'render.yaml', root/'Makefile']:
              if path.exists():
                  s = path.read_text()
                  s = re.sub(r'(?im)^.*(?:PAYNOW|PAYMENT|TOKEN_PRICE|TOKEN_USES).*$\n?', '', s)
                  s = s.replace("    'payment',\n", '')
                  path.write_text(s)

          # Remove payment app from Django installed apps / URL includes if present.
          for path in [root/'backend/backend/settings.py', root/'backend/backend/urls.py']:
              if path.exists():
                  s = path.read_text()
                  s = re.sub(r".*['\"]payment['\"].*\n", '', s)
                  s = re.sub(r".*payment\.urls.*\n", '', s)
                  path.write_text(s)

          # Remove payment-related test files and migrations.
          for path in root.rglob('*'):
              if not path.is_file() or '.git' in path.parts:
                  continue
              low = str(path).lower()
              if ('payment' in path.name.lower() or 'paynow' in path.name.lower()) and path.suffix in {'.py','.ts','.tsx','.js','.jsx'}:
                  # Dedicated payment files should already be gone; remove any remaining payment-only files.
                  if 'core/services/conversation/payment_integration.py' not in str(path):
                      try: path.unlink()
                      except OSError: pass

          # Keep the main README explicitly aligned with free use.
          readme = root/'README.md'
          if readme.exists():
              s = readme.read_text()
              if 'Free use' not in s:
                  s += '\n\n## Current access model\n\nJeff is currently free for users. Students can search for accommodation, select properties, submit booking requests, communicate with providers, and receive booking confirmations without payment or tokens. Monetization will be added later after the core search and booking experience is fully stable.\n'
              readme.write_text(s)
          PY

      - name: Verify no active payment code remains
        shell: bash
        run: |
          set -e
          if git grep -nEi 'paynow|PAYNOW|payment_integration|payment-webhook|payment-handler|payment_handler|token_handler|TOKEN_PRICE|TOKEN_USES|/payment/|payment_confirmation|token_check' -- \
              ':!*.md' ':!privacy/*' ':!*.lock' ':!supabase/migrations/*'; then
            echo 'Payment-related source references remain.'
            exit 1
          fi

      - name: Commit free-mode cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'refactor: remove payment functionality and enable free use'
          git push

      - name: Remove this temporary migration workflow
        if: success()
        shell: bash
        run: |
          # Leave the workflow cleanup to the next commit; the workflow is intentionally
          # excluded from the source-payment verification above.
          true
